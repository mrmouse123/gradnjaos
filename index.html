<!DOCTYPE html>
<html lang="sr-Latn-RS">
<!-- GradnjaOS — Pilot PM alat za građevinsku firmu -->
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GradnjaOS — kontrolna tabla</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

  :root{
    --paper:#F7F6F2; --surface:#FFFFFF;
    --ink:#16191D; --muted:#71767E; --faint:#9AA0A6;
    --line:#E9E7E1; --line-strong:#D8D5CC;
    --blue:#1F4E79; --blue-2:#2E6BA3; --blue-soft:#EAF1F8;
    --amber:#DF8E1C; --amber-soft:#FBF1DE;
    --green:#2E9E5B; --green-soft:#E6F4EB;
    --red:#D2453F; --red-soft:#FBEAE9;
    --slate:#3B4048;
    --radius:14px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(20,25,30,.04), 0 8px 24px -12px rgba(20,25,30,.12);
    --shadow-lg:0 12px 40px -16px rgba(20,25,30,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background-image:
      linear-gradient(rgba(31,78,121,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(31,78,121,.028) 1px, transparent 1px);
    background-size:34px 34px;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit; cursor:pointer}
  select,input,textarea{font-family:inherit}

  /* ---------- Layout ---------- */
  .app{display:grid; grid-template-columns:240px 1fr; min-height:100vh}
  .side{height:100dvh; 
    background:linear-gradient(178deg, #142638 0%, #1A3550 58%, #1F4066 100%);
    border-right:1px solid #0F1D2B;
    padding:20px 14px; position:sticky; top:0; height:100vh; height:100dvh; overflow-y:auto; display:flex; flex-direction:column;
    padding-top:max(20px, env(safe-area-inset-top)); padding-bottom:max(20px, env(safe-area-inset-bottom));
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(178deg, #142638 0%, #1A3550 58%, #1F4066 100%);
    background-size:34px 34px, 34px 34px, 100% 100%;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 16px}
  .mark{width:34px; height:34px; border-radius:8px; background:linear-gradient(135deg,#F2B145,#DF8E1C); display:grid; place-items:center; flex:none; box-shadow:0 4px 12px -4px rgba(223,142,28,.55)}
  .mark svg{width:20px; height:20px}
  .mark svg *{stroke:#16283C !important}
  .brand b{font-family:'Space Grotesk'; font-size:16px; letter-spacing:-.2px; color:#fff}
  .brand small{display:block; color:#7E93AB; font-size:11px; letter-spacing:.04em; text-transform:uppercase}

  .role-box{margin:0 4px 14px; padding:10px 11px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09); border-radius:10px}
  .role-box label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:#7E93AB; font-weight:600; display:block; margin-bottom:6px}
  .role-box select{width:100%; border:1px solid rgba(255,255,255,.14); border-radius:8px; padding:7px 9px; font-size:12.5px; background:#20395A; color:#EAF1F8; outline:none}
  .role-box .acc{font-size:12.5px; color:#EAF1F8; line-height:1.35; word-break:break-word}
  .role-box .acc small{display:block; color:#7E93AB; font-size:11px}
  .role-box .acc-btns{display:flex; gap:6px; margin-top:8px}
  .role-box .acc-btns button{flex:1; background:transparent; border:1px solid rgba(255,255,255,.18); color:#D7E3EF; border-radius:7px; padding:5px 0; font-size:11px; cursor:pointer}
  .role-box .acc-btns button:hover{background:rgba(255,255,255,.08)}
  body.login .side{display:none} body.login .app{grid-template-columns:1fr} body.login .menu-btn{display:none}
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px}
  .login-card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:26px 24px; box-shadow:0 10px 30px rgba(0,0,0,.06)}
  .login-card h1{font-size:20px; margin:0 0 4px} .login-card p{color:var(--muted); font-size:13px; margin:0 0 18px}
  .login-card .f-row{margin-bottom:12px}
  .login-card label{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; margin-bottom:5px}
  .login-card input{width:100%; border:1px solid var(--line); border-radius:9px; padding:10px 11px; font-size:14px; background:var(--paper); color:var(--ink); outline:none}
  .login-card input:focus{border-color:var(--blue-2)}
  .login-card .err{color:var(--red); font-size:12.5px; margin:0 0 10px}
  .login-card .ok{color:var(--green); font-size:12.5px; margin:0 0 10px}

  .nav{display:flex; flex-direction:column; gap:2px}
  .nav button{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:none; border:0; padding:9px 11px; border-radius:9px; color:#A9BCD1;
    font-size:13.5px; font-weight:500; transition:.14s; position:relative;
  }
  .nav button:hover{background:rgba(255,255,255,.06); color:#E4EDF6}
  .nav button.active{background:rgba(255,255,255,.10); color:#fff; font-weight:600}
  .nav button.active::before{content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:3px; background:linear-gradient(#F2B145,#DF8E1C)}
  .nav button svg{width:17px; height:17px; flex:none; opacity:.8}
  .nav button.active svg{opacity:1; color:#F2B145}
  .nav .tag{margin-left:auto; font-size:11px; background:rgba(255,255,255,.10); color:#A9BCD1; padding:1px 7px; border-radius:20px; font-weight:600}
  .nav button.active .tag{background:#F2B145; color:#16283C}

  .side-foot{margin-top:auto; padding:12px 10px 2px; border-top:1px solid rgba(255,255,255,.10); font-size:11.5px; color:#7E93AB}
  .side-foot b{color:#D7E3EF}
  .side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4FC97E;margin-right:6px;vertical-align:middle;box-shadow:0 0 8px rgba(79,201,126,.6)}
  .side-foot .dot.mem{background:#F2B145;box-shadow:0 0 8px rgba(242,177,69,.6)}
  .side-foot .reset{margin-top:8px; font-size:11px; color:#A9BCD1; background:none; border:1px solid rgba(255,255,255,.16); border-radius:7px; padding:4px 9px; transition:.14s}
  .side-foot .reset:hover{background:rgba(255,255,255,.08); color:#fff}

  .main{padding:26px 30px 60px; max-width:1320px; min-width:0}   /* grid celija: bez ovoga Gantt/tabele sire ceo layout na telefonu */
  .topbar{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap}
  .topbar h1{font-size:24px; margin:0 0 3px; letter-spacing:-.4px}
  .topbar p{margin:0; color:var(--muted); font-size:13px}
  .top-right{display:flex; align-items:center; gap:8px}
  .today{font-size:12px; color:var(--muted); background:var(--surface); border:1px solid var(--line); padding:7px 12px; border-radius:20px; white-space:nowrap}
  .today b{color:var(--ink); font-weight:600}
  .print-btn{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:7px 13px; font-size:12px; color:var(--slate); font-weight:500; display:inline-flex; gap:6px; align-items:center}
  .print-btn svg{width:13px;height:13px}
  .print-btn:hover{border-color:var(--line-strong)}

  /* ---------- Cards ---------- */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
  .grid{display:grid; gap:16px}
  .kpis{grid-template-columns:repeat(4,1fr); margin-bottom:18px}
  .kpi{padding:16px 18px; position:relative; overflow:hidden}
  .kpi .lab{font-size:12px; color:var(--muted); font-weight:500; display:flex; align-items:center; gap:7px}
  .kpi .lab svg{width:15px;height:15px}
  .kpi .val{font-family:'Space Grotesk'; font-size:30px; font-weight:700; letter-spacing:-1px; margin-top:9px; line-height:1}
  .kpi .val small{font-size:14px; color:var(--faint); font-weight:600; letter-spacing:0}
  .kpi .sub{font-size:12px; margin-top:7px; color:var(--muted)}
  .kpi .sub .up{color:var(--green); font-weight:600}
  .kpi .sub .down{color:var(--red); font-weight:600}
  .kpi .accent{position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--blue)}
  .kpi.amber .accent{background:var(--amber)} .kpi.green .accent{background:var(--green)} .kpi.red .accent{background:var(--red)}

  .card-h{display:flex; align-items:center; justify-content:space-between; padding:15px 18px; border-bottom:1px solid var(--line)}
  .card-h h2,.card-h h3{margin:0; font-size:15px; letter-spacing:-.2px}
  .card-h .hint{font-size:12px; color:var(--faint)}
  .card-b{padding:8px 18px 16px}
  .card-b.tight{padding:4px 0 4px}

  .row2{grid-template-columns:1fr 1fr; align-items:start; margin-top:18px}
  @media(max-width:1050px){.row2{grid-template-columns:1fr}}

  /* ---------- Deadlines ---------- */
  .dl{display:flex; gap:12px; padding:12px 18px; border-bottom:1px solid var(--line); align-items:flex-start}
  .dl:last-child{border-bottom:0}
  .dl .when{width:52px; flex:none; text-align:center; background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:6px 2px}
  .dl .when .d{font-family:'Space Grotesk'; font-size:17px; font-weight:700; line-height:1}
  .dl .when .m{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:2px}
  .dl .nm{font-weight:600; font-size:13px}
  .dl .meta{font-size:12px; color:var(--muted); margin-top:2px}
  .dl.warn .when{border-color:var(--amber); background:var(--amber-soft)}
  .dl.over .when{border-color:var(--red); background:var(--red-soft)}
  .dl.over .when .d{color:var(--red)}

  /* ---------- Badges ---------- */
  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap; line-height:1.4}
  .badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
  .b-blue{color:var(--blue-2); background:var(--blue-soft)}
  .b-green{color:var(--green); background:var(--green-soft)}
  .b-amber{color:var(--amber); background:var(--amber-soft)}
  .b-red{color:var(--red); background:var(--red-soft)}
  .b-gray{color:var(--muted); background:var(--line)}

  /* ---------- Tables ---------- */
  table{width:100%; border-collapse:collapse}
  thead th{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); font-weight:600; text-align:left; padding:11px 16px; border-bottom:1px solid var(--line); white-space:nowrap}
  thead th.sortable{cursor:pointer; user-select:none; transition:.12s}
  thead th.sortable:hover{color:var(--blue)}
  thead th .arr{font-size:9px; margin-left:3px; color:var(--blue)}
  thead th.r, td.r{text-align:right}
  tbody td{padding:13px 16px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr{transition:.1s}
  tbody tr.clk{cursor:pointer}
  tbody tr.clk:hover{background:var(--paper)}
  td .strong{font-weight:600}
  td .sub{font-size:12px; color:var(--muted); margin-top:2px}
  .av{width:30px;height:30px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:inline-grid;place-items:center;font-weight:700;font-size:12px;font-family:'Space Grotesk';flex:none}
  .who{display:flex; align-items:center; gap:10px}
  .num-cell{font-variant-numeric:tabular-nums}
  .marza{font-weight:700; font-variant-numeric:tabular-nums}
  .m-good{color:var(--green)} .m-mid{color:var(--amber)} .m-bad{color:var(--red)}
  tr.grp td{background:var(--paper); font-size:12px; font-weight:600; color:var(--slate); padding:8px 16px; cursor:pointer; border-top:1px solid var(--line-strong)}
  tr.grp:hover td{background:var(--blue-soft)}
  tr.grp .g-dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:middle}
  tr.total td{border-top:2px solid var(--line-strong); font-weight:700; background:#fff; font-size:13px}
  .napl{display:flex; align-items:center; gap:8px; justify-content:flex-end}
  .napl .bar{width:60px}
  .napl b{font-size:12.5px; width:38px; text-align:right}
  .ppl{display:inline-flex; align-items:center; gap:6px; font-weight:600}
  .ppl svg{width:14px;height:14px;color:var(--faint)}

  .bar{height:7px; background:var(--line); border-radius:20px; overflow:hidden}
  .bar > span{display:block; height:100%; background:var(--blue); border-radius:20px}

  /* ---------- Toolbar ---------- */
  .tools{display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap}
  .search{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 12px; flex:1; min-width:200px; max-width:340px}
  .search svg{width:16px;height:16px;color:var(--faint)}
  .search input{border:0; outline:0; background:none; font:inherit; width:100%; color:var(--ink)}
  .chip{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:7px 14px; font-size:12.5px; font-weight:500; color:var(--slate); transition:.12s}
  .chip:hover{border-color:var(--line-strong)}
  .chip.active{background:var(--ink); color:#fff; border-color:var(--ink)}
  .btn{background:var(--blue); color:#fff; border:0; border-radius:10px; padding:9px 15px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:7px}
  .btn svg{width:15px;height:15px}
  .btn.ghost{background:var(--surface); color:var(--slate); border:1px solid var(--line)}

  /* ---------- Sites cards ---------- */
  .sites-grid{grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr)); gap:16px}
  .site-card{padding:0; overflow:hidden; cursor:pointer; transition:.14s}
  .site-card:hover{box-shadow:var(--shadow-lg); transform:translateY(-2px)}
  .site-card .hd{padding:15px 17px 13px; border-bottom:1px solid var(--line)}
  .site-card .hd .top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
  .site-card h3{font-size:15px; margin:0; letter-spacing:-.2px}
  .site-card .loc{font-size:12px; color:var(--muted); margin-top:4px; display:flex; align-items:center; gap:5px}
  .site-card .loc svg{width:12px;height:12px;opacity:.7}
  .site-card .bd{padding:14px 17px}
  .site-card .kv{display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; color:var(--muted)}
  .site-card .kv b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
  .site-card .foot{display:flex; align-items:center; gap:10px; margin-top:12px}
  .site-card .foot .bar{flex:1}

  /* ---------- Gantt ---------- */
  .gantt{overflow-x:auto}
  .gantt-inner{min-width:820px; padding:4px 0 10px}
  .g-head{display:grid; grid-template-columns:200px 1fr; border-bottom:1px solid var(--line-strong)}
  .g-months{display:grid}
  .g-months .gm{font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:.03em; padding:9px 6px; border-left:1px solid var(--line)}
  .g-row{display:grid; grid-template-columns:200px 1fr; border-bottom:1px solid var(--line); align-items:center}
  .g-row:last-child{border-bottom:0}
  .g-lab{padding:12px 14px}
  .g-lab .nm{font-weight:600; font-size:13px}
  .g-lab .cl{font-size:11.5px; color:var(--muted); margin-top:2px}
  .g-track{position:relative; height:56px}
  .g-grid{position:absolute; inset:0; display:grid}
  .g-grid span{border-left:1px solid var(--line)}
  .g-bar{position:absolute; top:50%; transform:translateY(-50%); height:24px; border-radius:7px; background:var(--blue-soft); border:1px solid #cfe0f0; overflow:hidden; display:flex; align-items:center}
  .g-bar .fill{position:absolute; left:0; top:0; bottom:0; background:var(--blue); opacity:.85}
  .g-bar .lbl{position:relative; font-size:11px; font-weight:600; color:var(--blue); padding:0 8px; white-space:nowrap; z-index:2}
  .g-bar.done{background:var(--green-soft); border-color:#cfe9d8} .g-bar.done .fill{background:var(--green)} .g-bar.done .lbl{color:var(--green)}
  .g-bar.late{background:var(--red-soft); border-color:#f2cfce} .g-bar.late .fill{background:var(--red)} .g-bar.late .lbl{color:var(--red)}
  .g-bar.plan{background:var(--paper); border-color:var(--line-strong)} .g-bar.plan .fill{background:var(--faint); opacity:.4} .g-bar.plan .lbl{color:var(--muted)}
  .g-today{position:absolute; top:0; bottom:0; width:2px; background:var(--amber); z-index:5}
  .g-today::after{content:"danas"; position:absolute; top:-2px; left:4px; font-size:10px; font-weight:700; color:var(--amber); background:var(--amber-soft); padding:1px 5px; border-radius:4px; white-space:nowrap}
  .legend{display:flex; gap:16px; flex-wrap:wrap; padding:12px 18px 2px; font-size:12px; color:var(--muted)}
  .legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:middle}

  /* ---------- Kanban ---------- */
  .kanban{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; align-items:start}   /* minmax(0,..): 1fr ima min-content minimum pa je na 1024px prelazio ekran */
  @media(max-width:1100px){.kanban{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .col{background:rgba(255,255,255,.5); border:1px solid var(--line); border-radius:var(--radius); padding:12px; min-width:0}
  .col-h{display:flex; align-items:center; gap:8px; padding:2px 4px 12px; font-size:13px; font-weight:600}
  .col-h .cnt{margin-left:auto; font-size:11px; background:var(--line); color:var(--muted); padding:1px 8px; border-radius:20px; font-weight:700}
  .col-h .k{width:9px;height:9px;border-radius:3px}
  .task{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:10px; box-shadow:0 1px 2px rgba(20,25,30,.03); cursor:grab; transition:.12s}
  .task:hover{border-color:var(--line-strong); box-shadow:var(--shadow)}
  .task:last-child{margin-bottom:0}
  .task .t{font-size:13px; font-weight:600; line-height:1.35}
  .task .site{font-size:11.5px; color:var(--muted); margin-top:5px; display:flex; align-items:center; gap:5px}
  .task .site svg{width:11px;height:11px;opacity:.7}
  .task .tf{display:flex; align-items:center; justify-content:space-between; margin-top:11px}
  .task .who2{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--slate)}
  .task .av-s{width:22px;height:22px;border-radius:6px;font-size:10px}
  .prio{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:5px; text-transform:uppercase; letter-spacing:.03em}
  .p-high{color:var(--red); background:var(--red-soft)} .p-mid{color:var(--amber); background:var(--amber-soft)} .p-low{color:var(--muted); background:var(--line)}

  /* ---------- Dnevnik ---------- */
  .diary-day{margin-bottom:22px}
  .diary-day > h3{font-size:13px; color:var(--muted); margin:0 0 10px; display:flex; align-items:center; gap:10px}
  .diary-day > h3::after{content:""; flex:1; height:1px; background:var(--line)}
  .entry{display:flex; gap:13px; padding:13px 16px; margin-bottom:10px}
  .entry .av{margin-top:2px}
  .entry .hd{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
  .entry .hd b{font-size:13px}
  .entry .hd .gr-link{font-size:12px; color:var(--blue); font-weight:600; cursor:pointer}
  .entry .hd .gr-link:hover{text-decoration:underline}
  .entry p{margin:5px 0 0; font-size:13px; color:var(--slate)}

  /* ---------- Drawer ---------- */
  .scrim{position:fixed; inset:0; background:rgba(20,25,30,.34); opacity:0; pointer-events:none; transition:.2s; z-index:40}
  .scrim.on{opacity:1; pointer-events:auto}
  .drawer{position:fixed; top:0; right:0; height:100vh; height:100dvh; width:460px; max-width:94vw; background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow-lg); transform:translateX(100%); transition:.24s cubic-bezier(.4,0,.2,1); z-index:41; overflow-y:auto}
  .drawer.on{transform:translateX(0)}
  .dr-h{padding:20px 22px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface); z-index:2}
  .dr-h .x{position:absolute; top:16px; right:18px; width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; color:var(--muted)}
  .dr-h .x:hover{background:var(--paper)}

/* U JS modelu zaposleni.grs/bivsi i podizvodjaci.grs OSTAJU nizovi (30+ mesta u kodu),
   ali u bazi zive kao join tabele — RLS ne moze da ogranici niz po gradilistu.
   zaposleni_gradiliste.aktivan: true = grs (trenutno), false = bivsi (istorija). */
const JOIN_TABELE=['zaposleni_gradiliste','podizvodjac_gradiliste'];
const PUSH_TABLES=[...TABLES, ...JOIN_TABELE];
/* Rukovodilac cita iz view-ova (finansijske kolone su NULL), pa ih ne sme ni slati
   nazad — server ih svakako drzi trigerom, ovo je da diff ne salje NULL. */
const FIN_KOLONE={gradilista:['budzet','troskovi','potroseno','naplaceno'], predmer:['cena'], podizvodjaci:['cena']};
function jeRukovodilacNalog(){ return !!(PROFIL && PROFIL.uloga!=='direktor'); }
function bezKolona(r,keys){ const o={...r}; keys.forEach(k=>delete o[k]); return o; }
function rowsZa(t,d){
  const ruk=jeRukovodilacNalog();
  if(t==='gradilista' && ruk) return (d.gradilista||[]).map(g=>bezKolona(g,FIN_KOLONE.gradilista));
  if(t==='predmer' && ruk) return (d.predmer||[]).map(x=>bezKolona(x,FIN_KOLONE.predmer));
  if(t==='zaposleni') return (d.zaposleni||[]).map(z=>{ const r={...z}; delete r.grs; delete r.bivsi; return r; });
  if(t==='podizvodjaci') return (d.podizvodjaci||[]).map(x=>{ const r={...x}; delete r.grs; return ruk?bezKolona(r,FIN_KOLONE.podizvodjaci):r; });
  if(t==='zaposleni_gradiliste') return (d.zaposleni||[]).flatMap(z=>{ const g=z.grs||[];
    return [...g.map(x=>({zaposleni_id:z.id, gradiliste_id:x, aktivan:true})),
            ...(z.bivsi||[]).filter(x=>!g.includes(x)).map(x=>({zaposleni_id:z.id, gradiliste_id:x, aktivan:false}))]; });
  if(t==='podizvodjac_gradiliste') return (d.podizvodjaci||[]).flatMap(x=>(x.grs||[]).map(g=>({podizvodjac_id:x.id, gradiliste_id:g})));
  return d[t]||[];
}
function kljucReda(t,r){
  return t==='zaposleni_gradiliste' ? r.zaposleni_id+'|'+r.gradiliste_id
       : t==='podizvodjac_gradiliste' ? r.podizvodjac_id+'|'+r.gradiliste_id : r.id;
}
/* Iz redova join tabela rekonstruise nizove u JS modelu, pa ih uklanja iz out. */
function spojiJoinTabele(out){
  const zg=out.zaposleni_gradiliste||[], pg=out.podizvodjac_gradiliste||[];
  (out.zaposleni||[]).forEach(z=>{
    z.grs=zg.filter(r=>r.zaposleni_id===z.id&&r.aktivan).map(r=>r.gradiliste_id);
    z.bivsi=zg.filter(r=>r.zaposleni_id===z.id&&!r.aktivan).map(r=>r.gradiliste_id);
  });
  (out.podizvodjaci||[]).forEach(x=>{ x.grs=pg.filter(r=>r.podizvodjac_id===x.id).map(r=>r.gradiliste_id); });
  delete out.zaposleni_gradiliste; delete out.podizvodjac_gradiliste;
}
function zapamtiSnapshot(d){
  PUSHED={};
  for(const t of PUSH_TABLES){ const m={}; rowsZa(t,d).forEach(r=>m[kljucReda(t,r)]=JSON.stringify(r)); PUSHED[t]=m; }
}
/* Citanje ide iz view-ova: isti redovi kao tabela (isto pravilo kao RLS), ali finansijske
   kolone su NULL osim direktoru — na samim tabelama te kolone NEMAJU select grant.
   Pisanje ide u tabele. */
const CITAJ_IZ={gradilista:'gradilista_v', predmer:'predmer_v', podizvodjaci:'podizvodjaci_v'};
const FIN_TABELE=['troskovi_st','situacije'];   // rukovodiocu server ne daje ni jedan red — ne trazimo ih
/* Rukovodilac nema finansijske redove, pa zdravlje(g) ne moze da racuna lokalno —
   skor dolazi sa servera (zdravlje_gradilista = ista formula). Jedan poziv za sva gradilista. */
async function osveziZdravlje(rerender){
  if(!supa || !jeRukovodilacNalog()) return;
  try{
    const {data,error}=await supa.rpc('zdravlja_mojih');
    if(error) throw new Error(error.message||String(error));
    const novi={}; (data||[]).forEach(r=>{ if(r&&r.id!=null) novi[r.id]=r.zdravlje; });
    const promena=JSON.stringify(novi)!==JSON.stringify(ZDR_SRV||{});
    ZDR_SRV=novi;
    if(rerender && promena) render();
  }catch(e){ console.error('zdravlja_mojih:', e); }
}
async function pushAll(d, opt){
  opt=opt||{};
  /* DIFF po redu: ide samo ono sto se promenilo od poslednjeg upisa. Pod RLS-om
     rukovodilac ne sme ni da pokusa upsert tudjih/direktorskih redova (greska),
     a usput nestaje "cela baza + base64 prilozi na svaki klik".
     Ne prekidamo na prvoj gresci — jedan los red ne sme da zaustavi ostale tabele. */
  const greske=[];
  for(const t of (opt.samo||PUSH_TABLES)){
    const rows=rowsZa(t,d), prev=PUSHED[t]||{};
    const izmenjeni = opt.sve ? rows : rows.filter(r=>prev[kljucReda(t,r)]!==JSON.stringify(r));
    if(!izmenjeni.length) continue;
    try{
      if(opt.sve){
        const {error}=await supa.from(t).upsert(izmenjeni);
        if(error) throw new Error(error.message||String(error));
      } else {
        /* postojeci -> UPDATE (upsert bi pao na INSERT WITH CHECK za rukovodioca), novi -> INSERT */
        const novi=izmenjeni.filter(r=>!(kljucReda(t,r) in prev)), stari=izmenjeni.filter(r=>kljucReda(t,r) in prev);
        if(novi.length){ const {error}=await supa.from(t).insert(novi); if(error) throw new Error(error.message||String(error)); }
        for(const r of stari){
          let q=supa.from(t).update(r);
          if(t==='zaposleni_gradiliste') q=q.eq('zaposleni_id',r.zaposleni_id).eq('gradiliste_id',r.gradiliste_id);
          else if(t==='podizvodjac_gradiliste') q=q.eq('podizvodjac_id',r.podizvodjac_id).eq('gradiliste_id',r.gradiliste_id);
          else q=q.eq('id',r.id);
          const {error}=await q; if(error) throw new Error(error.message||String(error));
        }
      }
      const nx={...prev}; izmenjeni.forEach(r=>nx[kljucReda(t,r)]=JSON.stringify(r)); PUSHED[t]=nx;
    }catch(e){ greske.push(t+': '+(e.message||e)); }
  }
  if(greske.length) throw new Error(greske.join(' | '));
}

/* Brisanje reda je EKSPLICITNA operacija, ne posledica diff-a.
   (Diff-brisanje bi u vise-korisnickom radu obrisalo tudje redove.) */
async function obrisiRed(tabela, id){
  const list=DATA[tabela]; if(!Array.isArray(list)) return false;
  const i=list.findIndex(r=>r.id===id); if(i<0) return false;
  list.splice(i,1);
  if(PUSHED[tabela]) delete PUSHED[tabela][id];
  if(mode==='supabase'){
    try{ const {error}=await supa.from(tabela).delete().eq('id',id); if(error) throw new Error(error.message); }
    catch(e){ saveErr='brisanje: '+(e.message||e); console.error('Supabase delete:', e); }
  }
  rebuildMaps(); saveState(); updateFoot();
  return true;
}

async function loadState(){
  if(supa){
    try{
      const out={};
      const ruk=jeRukovodilacNalog();
      for(const t of PUSH_TABLES){
        if(ruk && FIN_TABELE.includes(t)){ out[t]=[]; continue; }
        const q=supa.from(CITAJ_IZ[t]||t).select('*');
        const {data,error}=await (JOIN_TABELE.includes(t) ? q : q.order('id'));
        if(error) throw error;
        out[t]=data||[];
      }
      if(ruk) await osveziZdravlje(false);
      /* "Prazna baza" se gleda po SVIM tabelama, ne samo po gradilistima. */
      const praznaBaza = TABLES.every(t=>!(out[t]||[]).length);
      if(praznaBaza){
        if(PROFIL && PROFIL.uloga!=='direktor') throw new Error('Baza je prazna — demo podatke moze da zaseje samo direktor.');
        normalizeData(); await pushAll(DATA, {sve:true});   // prvi start: zasej demo
      } else { spojiJoinTabele(out); DATA=out; }
      mode='supabase'; updateFoot(); return;
    }catch(e){
      console.error('Supabase load:', e);
      alert('Ne mogu da ucitam podatke iz Supabase — radim u demo rezimu (izmene se NE cuvaju).\n\nNajcesci uzrok: besplatni plan pauzira projekat posle 7 dana bez koriscenja. Otvori supabase.com -> projekat "gradnjaos" -> Restore, sacekaj minut i osvezi stranicu.\n\nAko to nije, proveri URL/kljuc i da li je schema.sql pokrenut.');
    }
  }
  try{
    if(typeof window!=='undefined' && window.storage){
      try{
        const r=await window.storage.get(SKEY);
        if(r&&r.value){ const st=JSON.parse(r.value); if(st&&st.gradilista) DATA=st; }
      }catch(e){ /* kljuc jos ne postoji */ }
      mode='skladiste';
    }
  }catch(e){}
  updateFoot();
}

function saveState(){ clearTimeout(saveTimer); saveTimer=setTimeout(doSave,400); }
async function doSave(){
  /* pushAll je 13 uzastopnih HTTP poziva; bez ovog guarda dva preklopljena
     upisa mogu da vrate stariji snapshot preko novijeg. */
  if(saving){ dirty=true; return; }
  saving=true;
  try{
    if(mode==='supabase'){ await pushAll(JSON.parse(JSON.stringify(DATA))); saveErr=null; await osveziZdravlje(true); }
    else if(mode==='skladiste'){ await window.storage.set(SKEY, JSON.stringify(DATA)); saveErr=null; }
  }catch(e){
    saveErr=e.message||String(e);
    console.error('Cuvanje nije uspelo:', e);
  }finally{
    saving=false; updateFoot();
    if(dirty){ dirty=false; doSave(); }
  }
}
/* Poslednja izmena unutar debounce prozora se gubila pri zatvaranju taba. */
function flushSave(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; doSave(); } }
if(typeof window!=='undefined' && window.addEventListener){
  window.addEventListener('pagehide', flushSave);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushSave(); });
}

async function resetDemo(){
  if(mode==='supabase' && PROFIL && PROFIL.uloga!=='direktor'){ alert('Demo podatke moze da vrati samo direktor.'); return; }
  if(!confirm('Vratiti sve podatke na pocetni demo? Tvoje izmene ce biti obrisane.')) return;
  if(mode==='supabase'){
    /* Prvo upisi demo, pa tek onda pobrisi visak. Raniji redosled (obrisi sve ->
       upisi) je pri padu upisa ostavljao praznu bazu bez ikakvog povratka. */
    const novi=JSON.parse(JSON.stringify(DEMO));
    try{
      DATA=novi; normalizeData();
      await pushAll(DATA, {sve:true});
      const zadrzi={}; TABLES.forEach(t=>zadrzi[t]=new Set((DATA[t]||[]).map(r=>r.id)));
      for(const t of TABLES){
        const ids=[...zadrzi[t]];
        const q=supa.from(t).delete();
        const {error} = ids.length ? await q.not('id','in','("'+ids.join('","')+'")') : await q.neq('id','');
        if(error) throw new Error(error.message||String(error));
      }
      /* Join tabele nemaju id: obrisi sve pa upisi demo veze (jeftino za rekonstrukciju). */
      for(const t of JOIN_TABELE){
        const col = t==='zaposleni_gradiliste' ? 'zaposleni_id' : 'podizvodjac_id';
        const {error}=await supa.from(t).delete().neq(col,''); if(error) throw new Error(error.message||String(error));
      }
      await pushAll(DATA, {sve:true, samo:JOIN_TABELE});
      zapamtiSnapshot(DATA);
      saveErr=null;
    }catch(e){ console.error('Supabase reset:', e); saveErr='reset: '+(e.message||e); alert('Reset nije uspeo u potpunosti — proveri podnozje i konzolu.'); }
  } else {
    DATA=JSON.parse(JSON.stringify(DEMO));
    normalizeData();
    if(mode==='skladiste'){ try{ await window.storage.delete(SKEY); }catch(e){} }
  }
  rebuildMaps(); renderNav(); render();
}

function updateFoot(){
  const el=document.getElementById('sideFoot'); if(!el) return;
  if(saveErr){
    el.innerHTML='<span class="dot mem"></span> <b>Poslednje cuvanje NIJE uspelo</b><br>'
      +'<span style="opacity:.7">'+esc(saveErr.slice(0,140))+'</span>'
      +'<br><button class="reset" onclick="doSave()">\u21bb Pokusaj ponovo</button>';
    return;
  }
  const msg={
    supabase:'<span class="dot"></span> Baza: <b>Supabase</b> — izmene se cuvaju u bazi',
    skladiste:'<span class="dot"></span> Cuvanje: <b>aktivno</b> — izmene ostaju',
    memorija:'<span class="dot mem"></span> Cuvanje: <b>u memoriji</b><br><span style="opacity:.7">Za trajno cuvanje poveži Supabase (README)</span>'
  }[mode];
  const smeReset = !PROFIL || PROFIL.uloga==='direktor';
  el.innerHTML=msg+(smeReset?'<br><button class="reset" onclick="resetDemo()">↺ Vrati demo podatke</button>':'');
}

/* mape (rebuild posle svake izmene) */
let cliById={}, zapById={}, grById={};
function rebuildMaps(){
  cliById = Object.fromEntries(DATA.clijenti.map(c=>[c.id,c]));
  zapById = Object.fromEntries(DATA.zaposleni.map(z=>[z.id,z]));
  grById  = Object.fromEntries(DATA.gradilista.map(g=>[g.id,g]));
}

const TODAY=(()=>{const d=new Date(); d.setHours(0,0,0,0); return d;})();
const _iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>_iso(TODAY);
const plusDays=n=>{const d=new Date(TODAY); d.setDate(d.getDate()+n); return _iso(d);};
const MESECI = ['jan','feb','mar','apr','maj','jun','jul','avg','sep','okt','nov','dec'];
const MESECI_PUN = ['januar','februar','mart','april','maj','jun','jul','avgust','septembar','oktobar','novembar','decembar'];

/* ============================================================
   ULOGE (simulacija više korisnika)
   ============================================================ */
let ROLE = 'all'; // 'all' = direktor; inače id rukovodioca
let MODUL = 'sve';  // 'sve' | 'projektovanje' | 'izvodjenje'
let PODTIP = 'sve'; // samo za izvodjenje: 'sve' | 'visokogradnja' | 'niskogradnja'
const MODUL_BOJA = {projektovanje:'#6B5CA5', izvodjenje:'var(--blue)'};
const PODTIPOVI = {visokogradnja:'Visokogradnja', niskogradnja:'Niskogradnja'};
const PODTIP_BOJA = {visokogradnja:'var(--blue)', niskogradnja:'var(--amber)'};
function modLab(g){ return (g.modul||'izvodjenje')==='projektovanje' ? ('Projektovanje'+(g.nivo?' · '+g.nivo:'')) : PODTIPOVI[g.tip||'visokogradnja']; }
function modCol(g){ return (g.modul||'izvodjenje')==='projektovanje' ? MODUL_BOJA.projektovanje : PODTIP_BOJA[g.tip||'visokogradnja']; }
function setModul(m){ MODUL=m; PODTIP='sve'; renderNav(); render(); closeDrawer(); }
function setPodtip(t){ PODTIP=t; renderNav(); render(); closeDrawer(); }
function modulSeg(){
  const ops=[['sve','Svi moduli'],['projektovanje','Projektovanje'],['izvodjenje','Izvođenje radova']];
  let h=`<div class="modul-seg">${ops.map(o=>`<button class="${MODUL===o[0]?'on':''}" onclick="setModul('${o[0]}')">${o[0]!=='sve'?`<i style="background:${MODUL_BOJA[o[0]]}"></i>`:''}${o[1]}</button>`).join('')}</div>`;
  if(MODUL==='izvodjenje'){
    const sub=[['sve','Sve'],['visokogradnja','Visokogradnja'],['niskogradnja','Niskogradnja']];
    h+=`<div class="modul-seg">${sub.map(o=>`<button class="${PODTIP===o[0]?'on':''}" onclick="setPodtip('${o[0]}')">${o[0]!=='sve'?`<i style="background:${PODTIP_BOJA[o[0]]}"></i>`:''}${o[1]}</button>`).join('')}</div>`;
  }
  return '<div class="modul-wrap">'+h+'</div>';
}
function setRole(r){ if(PROFIL && PROFIL.uloga!=='direktor') return; ROLE=r; renderNav(); render(); closeDrawer(); }
function roleOptions(){
  const vodji=new Set(DATA.gradilista.map(g=>g.rukovodilac));
  const ruks = DATA.zaposleni.filter(z=>z.poz==='Rukovodilac gradilišta'||vodji.has(z.id));
  return `<option value="all" ${ROLE==='all'?'selected':''}>Direktor — svi projekti</option>` +
    ruks.map(z=>`<option value="${z.id}" ${ROLE===z.id?'selected':''}>${z.ime} — rukovodilac</option>`).join('');
}
function visibleSites(){
  let l = ROLE==='all' ? DATA.gradilista : DATA.gradilista.filter(g=>g.rukovodilac===ROLE);
  if(MODUL!=='sve') l = l.filter(g=>(g.modul||'izvodjenje')===MODUL);
  if(MODUL==='izvodjenje' && PODTIP!=='sve') l = l.filter(g=>(g.tip||'visokogradnja')===PODTIP);
  return l;
}
function visibleSiteIds(){ return new Set(visibleSites().map(g=>g.id)); }
function isDirector(){ return ROLE==='all'; }
/* Vlasnistvo gradilista: direktor sve, rukovodilac samo svoje.
   Koristiti u SVAKOJ funkciji koja prima grId spolja — funkcije su globalne,
   pa sakriveno dugme nije zastita (CLAUDE.md pravilo 2). */
function smemNa(grId){ const g=grById[grId]; return !!g && (isDirector() || g.rukovodilac===ROLE); }

/* ============================================================
   POMOĆNE
   ============================================================ */
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/`/g,'&#96;');
/* Obrnuto od esc(). DATA cuva tekst HTML-escapovan (CLAUDE.md pravilo 3), pa svaki
   izlaz koji NIJE HTML — CSV, telo mejla, ime fajla — mora proci kroz unesc(),
   inace korisnik dobije "Petrovic &amp; Sinovi" umesto "Petrovic & Sinovi". */
/* Broj iz korisnickog unosa. "1.234,50" i "1234.50" i "1.250" (hiljade) i "12.5".
   Pravilo: zarez je uvek decimalni; tacka je hiljade samo u obliku d{1,3}(.ddd)+. */
const broj=s=>{ s=String(s??'').trim().replace(/\s/g,''); if(!s) return 0;
  const n = s.includes(',') ? +s.replace(/\./g,'').replace(',','.')
          : +(/^-?\d{1,3}(\.\d{3})+$/.test(s) ? s.replace(/\./g,'') : s);
  return Number.isFinite(n)?n:0; };
const unesc=v=>String(v??'').replace(/&#96;/g,'`').replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&');
const fmtEur = n => '€' + Math.round(n).toLocaleString('sr-RS');
const fmtEurK = n => { const a=Math.abs(n), s=n<0?'-':''; return a>=1000000 ? '€'+s+(a/1000000).toFixed(2).replace('.',',')+'M' : '€'+s+Math.round(a/1000)+'k'; };
const initials = ime => ime.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const dParse = s => new Date(s+'T00:00:00');
const daysBetween = (a,b) => Math.round((b-a)/86400000);
function fmtDate(s){ const d=dParse(s); return d.getDate()+'. '+MESECI[d.getMonth()]+' '+d.getFullYear(); }
function marzaPct(g){ return g.budzet ? Math.round((g.budzet - g.troskovi)/g.budzet*1000)/10 : 0; }   // PLANSKA: budzet - planirani troskovi
/* OSTVARENA marza: budzet - stvarno potroseno (iz troskovi_st). Rano u projektu je
   visoka (malo potroseno) — smisao dobija kad se troskovi nagomilaju. */
function ostvMarzaPct(g){ return g.budzet ? Math.round((g.budzet - potroseno(g))/g.budzet*1000)/10 : 0; }
function sitZa(id){ return (DATA.situacije||[]).filter(s=>s.gr===id); }
function naplSum(g){ const s=sitZa(g.id); return s.length? s.filter(x=>x.status==='placeno').reduce((a,b)=>a+b.iznos,0) : (g.naplaceno||0); }
function naplataPct(g){ return g.budzet?Math.round(naplSum(g)/g.budzet*100):0; }
function canFinance(){ return isDirector(); }
function sitKasni(s){ return s.status==='kasni' || (s.status==='ceka' && daysBetween(TODAY,dParse(s.valuta))<0); }
function troskoviZa(grId){ return (DATA.troskovi_st||[]).filter(t=>t.gr===grId).sort((a,b)=>dParse(a.datum)-dParse(b.datum)); }
function potroseno(g){ const l=troskoviZa(g.id); return l.length ? l.reduce((a,b)=>a+(+b.iznos||0),0) : (g.potroseno||0); }
function subsZa(grId){ return (DATA.podizvodjaci||[]).filter(x=>(x.grs||[]).includes(grId)); }
function timNa(grId){ return DATA.zaposleni.filter(z=>(z.grs||[]).includes(grId)); }
/* 'Petar Kovacevic' -> 'Petar K.'; jednoclano ime ostaje kakvo jeste. */
function kratkoIme(ime){ const d=String(ime||'').trim().split(/\s+/); return d[0]+(d[1]?' '+d[1][0]+'.':''); }
function marzaClass(m){ return m>=15?'m-good':m>=8?'m-mid':'m-bad'; }

/* ---------- ZDRAVLJE PROJEKTA (0-100) ---------- */
function zdravlje(g){
  if(ZDR_SRV && Object.prototype.hasOwnProperty.call(ZDR_SRV, g.id) && ZDR_SRV[g.id]!=null) return ZDR_SRV[g.id];   // rukovodilac: server (nema finansijske redove)
  if(g.status==='zavrseno') return Math.min(100, 90 + (marzaPct(g)>=10?10:5));
  let sc=100;
  const diff=daysBetween(TODAY,dParse(g.rok));
  if(g.status==='kasni'||diff<0) sc-=35;
  else if(diff<=30 && g.napredak<90) sc-=15;
  const kasneZad=DATA.zadaci.filter(t=>t.gr===g.id && t.kol!=='done' && daysBetween(TODAY,dParse(t.rok))<0).length;
  sc-=Math.min(15, kasneZad*5);
  /* Finansijski penali ulaze UVEK — skor je objektivan i isti za sve uloge.
     Rukovodilac vidi broj, ali ne i finansijsko obrazlozenje (alerti fin:true
     su filtrirani u computeAlerts, iznosi su iza canFinance()). */
  const ocek=g.troskovi*g.napredak/100;
  if(g.napredak>0 && potroseno(g)>ocek*1.1) sc-=20;
  if(ostvMarzaPct(g)<8) sc-=10;
  if(g.napredak-naplataPct(g)>25) sc-=15;
  return Math.max(5,sc);
}
function zdrBoja(sc){ return sc>=80?'var(--green)':sc>=60?'var(--amber)':'var(--red)'; }
function ringSvg(sc,size){
  size=size||36; const r=(size-6)/2, c=2*Math.PI*r, off=c*(1-sc/100);
  return `<svg class="zdr-ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/>
    <circle class="arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${zdrBoja(sc)}" stroke-width="5"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"/>
  </svg>`;
}
function zdrCell(g){
  const sc=zdravlje(g);
  return `<td><div style="display:flex;align-items:center;gap:8px">${ringSvg(sc,34)}<b class="num" style="color:${zdrBoja(sc)};font-size:13.5px">${sc}</b></div></td>`;
}
function animateUI(){
  try{
    if(typeof document.querySelectorAll!=='function'||typeof requestAnimationFrame!=='function') return;
    document.querySelectorAll('.zdr-ring .arc').forEach(a=>{ requestAnimationFrame(()=>{ a.style.strokeDashoffset=a.dataset.off; }); });
    document.querySelectorAll('.kpi .val').forEach(el=>{
      const t=el.firstChild; if(!t||t.nodeType!==3) return;
      const raw=t.textContent.trim(); const n=parseInt(raw,10);
      if(isNaN(n)||String(n)!==raw||n<=0||n>10000) return;
      const dur=550, st=performance.now();
      const step=now=>{ const p=Math.min(1,(now-st)/dur); t.textContent=Math.round(n*(p*(2-p))); if(p<1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }catch(e){}
}

/* ---------- UPOZORENJA ---------- */
function computeAlerts(){
  const sites=visibleSites(); const ids=visibleSiteIds(); const out=[];
  sites.forEach(g=>{
    const dd=dParse(g.rok), diff=daysBetween(TODAY,dd);
    if(g.status!=='zavrseno'){
      if(diff<0) out.push({sev:'red', gr:g.id, tekst:'Rok prekoračen '+Math.abs(diff)+' d — napredak '+g.napredak+'%', nas:g.naziv});
      else if(diff<=30 && g.napredak<90) out.push({sev:'amber', gr:g.id, tekst:'Rok za '+diff+' d, a napredak je '+g.napredak+'%', nas:g.naziv});
      const ocek=g.troskovi*g.napredak/100;
      if(g.napredak>0 && potroseno(g)>ocek*1.1) out.push({sev:'amber', gr:g.id, fin:true, tekst:'Troškovi ('+fmtEurK(potroseno(g))+') idu ispred napretka — plan za ovu fazu '+fmtEurK(ocek), nas:g.naziv});
      if(g.napredak - naplataPct(g) > 25) out.push({sev:'amber', gr:g.id, fin:true, tekst:'Naplata ('+naplataPct(g)+'%) zaostaje za izvedenim radovima ('+g.napredak+'%)', nas:g.naziv});
    }
    const om=ostvMarzaPct(g), pm=marzaPct(g);
    if(om<8 && g.status!=='zavrseno') out.push({sev:'red', gr:g.id, fin:true, tekst:'Ostvarena marža pala na '+String(om).replace('.',',')+'%', nas:g.naziv});
    else if(potroseno(g)>g.troskovi && g.status!=='zavrseno') out.push({sev:'amber', gr:g.id, fin:true, tekst:'Troškovi premašili plan — ostvarena marža '+String(om).replace('.',',')+'% (plan '+String(pm).replace('.',',')+'%)', nas:g.naziv});
  });
  DATA.zadaci.forEach(t=>{
    if(t.kol==='done'||!ids.has(t.gr)) return;
    const diff=daysBetween(TODAY,dParse(t.rok));
    if(diff<0) out.push({sev:'red', gr:t.gr, tekst:'Zadatak „'+t.naziv+'" kasni '+Math.abs(diff)+' d', nas:grById[t.gr]?grById[t.gr].naziv:''});
  });
  (DATA.situacije||[]).forEach(s=>{
    if(!ids.has(s.gr)||s.status==='placeno') return;
    if(sitKasni(s)) out.push({sev:'red', gr:s.gr, fin:true, tekst:'Situacija '+s.br+' ('+fmtEurK(s.iznos)+') nije plaćena — valuta '+fmtDate(s.valuta), nas:grById[s.gr]?grById[s.gr].naziv:''});
  });
  (DATA.resursi||[]).forEach(r=>{
    if(!r.istice) return;
    if(r.gr && !ids.has(r.gr)) return;   // tudje gradiliste ne sme ni u upozorenja
    const d=daysBetween(TODAY,dParse(r.istice));
    const nas=r.gr&&grById[r.gr]?grById[r.gr].naziv:'Firma';
    if(d<0) out.push({sev:'red', gr:r.gr||null, tekst:'Isteklo: '+r.naziv+' ('+(r.napomena||RES_TIP[r.tip]||'resurs')+', '+fmtDate(r.istice)+')', nas});
    else if(d<=30) out.push({sev:'amber', gr:r.gr||null, tekst:'Ističe za '+d+' d: '+r.naziv+' ('+(r.napomena||RES_TIP[r.tip]||'resurs')+')', nas});
  });
  return out.filter(a=>canFinance()||!a.fin).sort((a,b)=>(a.sev==='red'?0:1)-(b.sev==='red'?0:1));
}

/* ---------- KONTROLNA TABLA ---------- */
let dashSort={key:'smart',dir:-1};
function setDashSort(k){
  if(dashSort.key===k && k!=='smart') dashSort.dir*=-1;
  else dashSort={key:k,dir:-1};
  render();
}
function dashSorted(sites){
  const arr=[...sites];
  if(dashSort.key==='smart'){
    const st={'kasni':0,'u toku':1,'planirano':2,'zavrseno':3};
    arr.sort((a,b)=> (st[a.status]??9)-(st[b.status]??9) || dParse(a.rok)-dParse(b.rok));
    return arr;
  }
  const v=g=>({cena:g.budzet, marza:marzaPct(g), naplata:naplataPct(g), ljudi:timNa(g.id).length, napredak:g.napredak, rok:dParse(g.rok).getTime(), zdr:zdravlje(g)}[dashSort.key]||0);
  arr.sort((a,b)=>(v(b)-v(a))*(-dashSort.dir));
  return arr;
}

  const dan=['nedelja','ponedeljak','utorak','sreda','četvrtak','petak','subota'][TODAY.getDay()];
  const aktProj=sites.filter(g=>g.status!=='zavrseno'&&g.status!=='planirano');
  const najrizik=[...aktProj].sort((a,b)=>zdravlje(a)-zdravlje(b))[0];
  const rokovi7=sites.filter(g=>g.status!=='zavrseno'&&daysBetween(TODAY,dParse(g.rok))>=0&&daysBetween(TODAY,dParse(g.rok))<=7).length
              + DATA.zadaci.filter(t=>t.kol!=='done'&&ids.has(t.gr)&&daysBetween(TODAY,dParse(t.rok))>=0&&daysBetween(TODAY,dParse(t.rok))<=7).length;
  const bl=[];
  if(fin){
    const dosp=(DATA.situacije||[]).filter(x=>ids.has(x.gr)&&x.status!=='placeno'&&sitKasni(x));
    if(dosp.length) bl.push(['var(--red)',`<b>${fmtEur(dosp.reduce((a,b)=>a+b.iznos,0))}</b> dospelo za naplatu (${dosp.length} situacij${dosp.length===1?'a':'e'}) — proveri tab Naplata`]);
    if(najrizik) bl.push([zdrBoja(zdravlje(najrizik)),`Najrizičniji projekat: <b>${najrizik.naziv}</b> — zdravlje ${zdravlje(najrizik)}/100`]);
    bl.push(['var(--blue-2)',`U narednih 7 dana dospeva <b>${rokovi7}</b> rokova (projekti + zadaci)`]);
  } else {
    const moji=DATA.zadaci.filter(t=>t.kol!=='done'&&ids.has(t.gr));
    const danas=moji.filter(t=>daysBetween(TODAY,dParse(t.rok))===0).length;
    const kasneT=moji.filter(t=>daysBetween(TODAY,dParse(t.rok))<0).length;
    bl.push([kasneT?'var(--red)':'var(--green)',`Zadaci: <b>${danas}</b> dospeva danas${kasneT?`, <b>${kasneT}</b> već kasni`:', ništa ne kasni'}`]);
    if(najrizik) bl.push([zdrBoja(zdravlje(najrizik)),`<b>${najrizik.naziv}</b> — zdravlje ${zdravlje(najrizik)}/100, rok ${fmtDate(najrizik.rok)}`]);
    bl.push(['var(--blue-2)',`U narednih 7 dana dospeva <b>${rokovi7}</b> rokova`]);
  }
  const briefCard=`<div class="brief">
    <div class="b-date">${dan}, ${TODAY.getDate()}. ${MESECI_PUN[TODAY.getMonth()]} ${TODAY.getFullYear()}.</div>
    <h2>${fin?'Dobro jutro — stanje firme na jedan pogled':'Dobro jutro — tvoja gradilišta danas'}</h2>
    ${bl.map(x=>`<div class="b-line"><span class="b-dot" style="background:${x[0]}"></span><span>${x[1]}</span></div>`).join('')}
  </div>`;

  // grupisanje tabele po modulima + red UKUPNO
  let finBody='';
  const NCOLS = fin ? 8 : 6;
  const grpRed=(lab,boja,gs,klik)=>{
    if(!gs.length) return '';
    const c=gs.reduce((a,b)=>a+b.budzet,0), m=gs.reduce((a,b)=>a+(b.budzet-b.troskovi),0), n=gs.reduce((a,b)=>a+naplSum(b),0);
    return `<tr class="grp" onclick="${klik}"><td colspan="${NCOLS}"><span class="g-dot" style="background:${boja}"></span>${lab} · ${gs.length} proj.${fin?` · ${fmtEurK(c)} · plan. marža ${c?String(Math.round(m/c*1000)/10).replace('.',','):0}% · naplata ${c?Math.round(n/c*100):0}%`:''}</td></tr>`
      + dashSorted(gs).map(rowHtml).join('');
  };
  const grupe = (fin && MODUL==='sve') ? [
      ['Projektovanje', MODUL_BOJA.projektovanje, sites.filter(g=>(g.modul||'izvodjenje')==='projektovanje'), "setModul('projektovanje')"],
      ['Izvođenje radova', MODUL_BOJA.izvodjenje, sites.filter(g=>(g.modul||'izvodjenje')==='izvodjenje'), "setModul('izvodjenje')"]
    ] : (fin && MODUL==='izvodjenje'&&PODTIP==='sve') ? [
      ['Visokogradnja', PODTIP_BOJA.visokogradnja, sites.filter(g=>(g.tip||'visokogradnja')==='visokogradnja'), "setPodtip('visokogradnja')"],
      ['Niskogradnja', PODTIP_BOJA.niskogradnja, sites.filter(g=>(g.tip||'visokogradnja')==='niskogradnja'), "setPodtip('niskogradnja')"]
    ] : null;
  if(grupe) finBody = grupe.map(x=>grpRed(x[0],x[1],x[2],x[3])).join('');
  else finBody = dashSorted(sites).map(rowHtml).join('');
  if(fin && sites.length>1){
    const c=sites.reduce((a,b)=>a+b.budzet,0), m=sites.reduce((a,b)=>a+(b.budzet-b.troskovi),0), n=sites.reduce((a,b)=>a+naplSum(b),0);
    const ppl=new Set(); sites.forEach(g=>timNa(g.id).forEach(z=>ppl.add(z.id)));
    const wNap=c?Math.round(sites.reduce((a,b)=>a+b.napredak*b.budzet,0)/c):0;
    finBody += `<tr class="total">
      <td>UKUPNO · ${sites.length} projekata</td><td></td>
      <td class="r num-cell">${fmtEurK(c)}</td>
      <td class="r"><span class="marza ${marzaClass(c?m/c*100:0)}">${c?String(Math.round(m/c*1000)/10).replace('.',','):0}%</span><div class="sub num">${fmtEurK(m)}</div></td>
      <td class="r"><b class="num">${c?Math.round(n/c*100):0}%</b><div class="sub num">${fmtEurK(n)}</div></td>
      <td class="r num-cell">${ppl.size}</td>
      <td class="r num-cell">${wNap}%</td><td></td>
    </tr>`;
  }
  return head('Kontrolna tabla', fin?'Finansije, napredak i rokovi svih projekata na jednom mestu.':'Napredak, rokovi i zadaci na tvojim gradilištima.') +
  briefCard +
  `<div class="grid kpis">
    <div class="card kpi"><div class="accent"></div>
      <div class="lab">${icon('site')} Aktivna gradilišta</div>
      <div class="val num">${aktivni.length}<small> / ${sites.length}</small></div>
      <div class="sub">${sites.filter(g=>g.status==='planirano').length} u pripremi, ${sites.filter(g=>g.status==='zavrseno').length} završeno</div>
    </div>
    <div class="card kpi ${kasne.length?'red':'green'}"><div class="accent"></div>
      <div class="lab">${icon('warn')} Kasne s rokom</div>
      <div class="val num">${kasne.length}</div>
      <div class="sub">${kasne.length?'<span class="down">Zahteva pažnju</span>':'<span class="up">Sve u planu</span>'}</div>
    </div>${finKpis}
  </div>

  ${alertsCard}

  <div class="card">
    <div class="card-h"><h2>${fin?'Finansije po projektu':'Moja gradilišta'}</h2><span class="hint">${dashSort.key==='smart'?'Sortirano po hitnosti \u00b7 klik na kolonu menja':'Klik na kolonu menja sortiranje \u00b7 \u201eProjekat\u201c vra\u0107a po hitnosti'}</span></div>
    <div style="overflow-x:auto"><table>
      <thead><tr>${finHead}</tr></thead>
      <tbody>${finBody}</tbody>
    </table></div>
  </div>

  <div class="grid row2">
    <div class="card">
      <div class="card-h"><h3>Nadolazeći rokovi</h3><span class="hint">${dl.length} ukupno</span></div>
      <div class="card-b tight">${dlHtml}</div>
    </div>
    <div class="card">
      <div class="card-h"><h3>Poslednje iz dnevnika radova</h3><button class="btn ghost" style="padding:5px 11px;font-size:12px" onclick="go('diary')">Sve →</button></div>
      <div class="card-b tight">${diaryHtml}</div>
    </div>
  </div>`;
}

let siteFilter='all', siteQuery='';
function viewSites(){
  const filters=[['all','Sva'],['u toku','U toku'],['kasni','Kasne'],['planirano','Planirana'],['zavrseno','Završena']];
  return head('Gradilišta','Klikni na karticu za detalje projekta, budžet i zadatke.') +
  `<div class="tools">
    <div class="search">${icon('search')}<input id="siteSearch" placeholder="Pretraži gradilišta ili lokaciju…" value="${esc(siteQuery)}"></div>
    ${filters.map(f=>`<button class="chip ${siteFilter===f[0]?'active':''}" onclick="setSiteFilter('${f[0]}')">${f[1]}</button>`).join('')}
    ${isDirector()?`<button class="btn" style="margin-left:auto" onclick="formSite()">${icon('plus')} Novo gradilište</button>`:''}
  </div>
  <div id="sitesGrid" class="grid sites-grid">${sitesCards()}</div>`;
}
function sitesCards(){
  let list = visibleSites().filter(g=> siteFilter==='all'||g.status===siteFilter);
  if(siteQuery.trim()){ const q=siteQuery.toLowerCase(); list=list.filter(g=>(g.naziv+' '+g.lok).toLowerCase().includes(q)); }
  if(!list.length) return `<div class="empty">Nema gradilišta koja odgovaraju filteru.</div>`;
  return list.map(g=>{
    const cl=cliById[g.klijent], ruk=zapById[g.rukovodilac];
    const barCol = g.status==='kasni'?'var(--red)':g.status==='zavrseno'?'var(--green)':'var(--blue)';
    const m=marzaPct(g);
    return `<div class="card site-card" onclick="openSite('${g.id}')">
      <div class="hd">
        <div class="top"><h3>${g.naziv}</h3>${badge(g.status)}</div>
        <div class="loc">${icon('pin')} ${g.lok} · <span style="color:${modCol(g)};font-weight:600">${modLab(g)}</span></div>
      </div>
      <div class="bd">
        <div class="kv"><span>Klijent</span><b>${cl?cl.naziv:'—'}</b></div>
        ${canFinance()?`<div class="kv"><span>Cena / plan. marža</span><b>${fmtEurK(g.budzet)} · <span class="${marzaClass(m)}">${String(m).replace('.',',')}%</span></b></div>
        <div class="kv"><span>Naplaćeno</span><b>${naplataPct(g)}%</b></div>`:''}
        <div class="kv"><span>Rukovodilac</span><b>${ruk?kratkoIme(ruk.ime):'—'}</b></div>
        <div class="kv"><span>Početak</span><b>${fmtDate(g.pocetak)}</b></div>
        <div class="kv"><span>Rok završetka</span><b>${g.status!=='zavrseno'&&daysBetween(TODAY,dParse(g.rok))<0?`<span style="color:var(--red)">${fmtDate(g.rok)}</span>`:fmtDate(g.rok)}</b></div>
        <div class="foot">
          <div class="bar"><span style="width:${g.napredak}%; background:${barCol}"></span></div>
          <span class="num" style="font-size:12px;font-weight:700">${g.napredak}%</span>
        </div>
      </div>
    </div>`;
  }).join('');
}
function setSiteFilter(f){ siteFilter=f; render(); }
function bindSitesSearch(){ const el=document.getElementById('siteSearch'); if(!el)return;
  el.oninput=e=>{ siteQuery=e.target.value; document.getElementById('sitesGrid').innerHTML=sitesCards(); };
}

/* ---------- ROKOVI (GANTT) ---------- */
function viewTime(){
  const vs=visibleSites();
  if(!vs.length) return head('Rokovi','Vremenska osa projekata.')+'<div class="card"><div class="empty">Nema projekata za prikaz.</div></div>';
  const allD=vs.flatMap(g=>[dParse(g.pocetak),dParse(g.rok)]).concat([TODAY]);
  const minD=new Date(Math.min(...allD.map(d=>+d))), maxD=new Date(Math.max(...allD.map(d=>+d)));
  const start=new Date(minD.getFullYear(),minD.getMonth(),1), end=new Date(maxD.getFullYear(),maxD.getMonth()+2,1);
  const totalMs=end-start;
  const months=[]; let cur=new Date(start);
  while(cur<end){ months.push(new Date(cur)); cur.setMonth(cur.getMonth()+1); }
  const colTmpl=`repeat(${months.length},1fr)`;
  const monHead=months.map(m=>`<div class="gm">${MESECI[m.getMonth()]}${m.getMonth()===0?" '"+String(m.getFullYear()).slice(2):''}</div>`).join('');
  const gridSpans=months.map(()=>'<span></span>').join('');
  const todayLeft=((TODAY-start)/totalMs*100);

  const rows=[...visibleSites()].sort((a,b)=>dParse(a.pocetak)-dParse(b.pocetak)).map(g=>{
    const s=dParse(g.pocetak), e=dParse(g.rok);
    let left=(s-start)/totalMs*100, width=(e-s)/totalMs*100;
    left=Math.max(0,Math.min(98,left)); width=Math.max(2,Math.min(100-left,width));
    const cls=g.status==='zavrseno'?'done':g.status==='kasni'?'late':g.status==='planirano'?'plan':'';
    const cl=cliById[g.klijent];
    return `<div class="g-row">
      <div class="g-lab"><div class="nm">${g.naziv.length>26?g.naziv.slice(0,25)+'…':g.naziv}</div><div class="cl">${cl?cl.naziv:''}</div></div>
      <div class="g-track">
        <div class="g-grid" style="grid-template-columns:${colTmpl}">${gridSpans}</div>
        <div class="g-bar ${cls}" style="left:${left}%; width:${width}%" title="${g.naziv} · ${g.napredak}%">
          <div class="fill" style="width:${g.napredak}%"></div>
          <span class="lbl">${g.napredak}%</span>
        </div>
      </div>
    </div>`;
  }).join('');

  return head('Rokovi','Vremenska osa svih projekata sa trenutnim napretkom (Gantt).') +
  `<div class="card">
    <div class="legend">
      <span><i style="background:var(--blue)"></i>U toku</span>
      <span><i style="background:var(--red)"></i>Kasni</span>
      <span><i style="background:var(--green)"></i>Završeno</span>
      <span><i style="background:var(--faint)"></i>Planirano</span>
      <span style="margin-left:auto"><i style="background:var(--amber)"></i>Današnji datum</span>
    </div>
    <div class="gantt"><div class="gantt-inner">
      <div class="g-head">
        <div style="padding:9px 14px;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600">Projekat</div>
        <div class="g-months" style="grid-template-columns:${colTmpl}">${monHead}</div>
      </div>
      <div style="position:relative">
        <div class="g-today" style="left:calc(200px + (100% - 200px) * ${todayLeft/100})"></div>
        ${rows}
      </div>
    </div></div>
  </div>`;
}

      const g=grById[t.gr], z=zapById[t.zad], p=PRIO[t.prio];

      const rokTxt = t.kol==='done' ? 'Završeno'
        : diff<0 ? `<span style="color:var(--red);font-weight:600">Kasni ${Math.abs(diff)}d</span>`
        : diff===0 ? `<span style="color:var(--amber);font-weight:600">Danas</span>`

      return `<div class="task" draggable="true" ondragstart="dragStart(event,'${t.id}')" onclick="openSite('${t.gr}')">

    }).join('') || `<div style="text-align:center;color:var(--faint);font-size:12px;padding:18px 0">Prevuci zadatak ovde</div>`;

let dragId=null;
function dragStart(e,id){ dragId=id; e.dataTransfer.effectAllowed='move'; }
function dropTask(e,col){
  e.preventDefault();

  const t=DATA.zadaci.find(x=>x.id===id);

  t.kol=col; saveState(); render();
}

const ADM_ST={nema:['Nema','b-red','✗'], priprema:['U pripremi','b-amber','…'], ima:['Ima','b-green','✓']};
function admInfo(g,key){
  let v=(g.adm||{})[key];
  if(v===true) v={st:'ima'}; else if(!v||v===false) v={st:'nema'}; else if(!v.st) v.st='nema';
  return v;
}
function setAdmStatus(grId,key,val){
  if(!isDirector()) return;
  const g=grById[grId]; if(!g||!ADM_ST[val]) return;
  g.adm=g.adm||{}; g.adm[key]=Object.assign(admInfo(g,key),{st:val});
  saveState(); openSite(grId);
}
function setAdmDoc(grId,key,doc){
  if(!isDirector()) return;
  const g=grById[grId]; if(!g) return;
  g.adm=g.adm||{}; const a=admInfo(g,key); a.doc=doc; if(a.st==='nema') a.st='ima';
  g.adm[key]=a; saveState(); openSite(grId);
}
function ukloniAdmDoc(grId,key){
  if(!isDirector()) return;
  const g=grById[grId]; if(!g) return;
  const a=admInfo(g,key); delete a.doc; g.adm[key]=a;
  saveState(); openSite(grId);
}
function uploadAdmDoc(grId,key){
  if(!isDirector()) return;
  try{
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='.pdf,.jpg,.jpeg,.png';
    inp.onchange=e=>{
      const f=e.target.files&&e.target.files[0]; if(!f) return;
      if(f.size>2.5*1024*1024){ alert('Dokument je veći od 2.5MB — u pilotu važi taj limit (veći fajlovi stižu uz Supabase Storage).'); return; }
      const r=new FileReader();
      r.onload=()=>setAdmDoc(grId,key,{name:esc(f.name),datum:todayStr(),data:r.result});
      r.readAsDataURL(f);
    };
    inp.click();
  }catch(e){}
}
function otvoriAdmDoc(grId,key){
  const g=grById[grId]; if(!g) return;
  if(!(isDirector()||g.rukovodilac===ROLE)) return;
  const d=admInfo(g,key).doc; if(!d||!d.data) return;
  try{
    const parts=String(d.data).split(',');
    const bin=atob(parts[1]);
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    const mime=(parts[0].match(/data:(.*?);/)||[])[1]||'application/pdf';
    window.open(URL.createObjectURL(new Blob([arr],{type:mime})),'_blank');
  }catch(e){}
}

  if(jePro(g)) return FAZE_PRO;
  const s=SABLONI_FAZA[g.tip||'visokogradnja']||SABLONI_FAZA.visokogradnja;

/* Sejanje zadataka iz sablona. Rokovi: faza i dobija (i+1)/N puta trajanje gradilista. */
function primeniSablonFaza(grId){
  if(!isDirector()) return 0;
  const g=grById[grId]; if(!g || jePro(g)) return 0;
  const s=SABLONI_FAZA[g.tip||'visokogradnja']; if(!s) return 0;
  const od=dParse(g.pocetak||todayStr()), doD=dParse(g.rok||plusDays(180));
  const traj=Math.max(1, daysBetween(od,doD));
  const ts=Date.now(); let n=0;
  s.forEach((f,i)=>{
    const d=new Date(od); d.setDate(d.getDate()+Math.round(traj*(i+1)/s.length));
    const rok=_iso(d);
    f.zadaci.forEach(z=>{
      DATA.zadaci.push({ id:'t'+ts+'-'+(n++), naziv:esc(f.faza+' — '+z), gr:grId, zad:g.rukovodilac||null, prio:'mid', kol:'todo', rok });
    });
  });
  return n;
}

function saveTrosak(grId){
  if(!canFinance()) return;
  const v=id=>{const e=document.getElementById(id); return e?e.value:'';};

  const g=grById[grId];
  if(g && !troskoviZa(grId).length && g.potroseno>0){

  }

  saveState(); closeModal(); renderNav(); render(); openSite(grId);

/* ---------- PRILOG UZ TROSAK (faktura kao PDF/slika) ---------- */
function uploadTrosakPrilog(trId){
  if(!canFinance()) return;
  const t=(DATA.troskovi_st||[]).find(x=>x.id===trId); if(!t) return;
  try{
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='.pdf,.jpg,.jpeg,.png';
    inp.onchange=e=>{
      const f=e.target.files&&e.target.files[0]; if(!f) return;
      if(f.size>2.5*1024*1024){ alert('Dokument je veći od 2.5MB — u pilotu važi taj limit (veći fajlovi stižu uz Supabase Storage).'); return; }
      const r=new FileReader();
      r.onload=()=>{ t.prilog={name:esc(f.name),datum:todayStr(),data:r.result}; saveState(); render(); openSite(t.gr); };
      r.readAsDataURL(f);
    };
    inp.click();
  }catch(e){}
}
function otvoriTrosakPrilog(trId){
  if(!canFinance()) return;
  const t=(DATA.troskovi_st||[]).find(x=>x.id===trId); if(!t||!t.prilog||!t.prilog.data) return;
  try{
    const parts=String(t.prilog.data).split(',');
    const bin=atob(parts[1]);
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    const mime=(parts[0].match(/data:(.*?);/)||[])[1]||'application/pdf';
    window.open(URL.createObjectURL(new Blob([arr],{type:mime})),'_blank');
  }catch(e){}
}
function ukloniTrosakPrilog(trId){
  if(!canFinance()) return;
  const t=(DATA.troskovi_st||[]).find(x=>x.id===trId); if(!t) return;
  delete t.prilog; saveState(); render(); openSite(t.gr);
}

function autorIme(n){ if(n.autor==='direkcija') return 'Direkcija'; const z=zapById[n.autor]; return z?z.ime:'\u2014'; }
function narudzbaMailBody(n){

  const n=(DATA.narudzbe||[]).find(x=>x.id===id); if(!n) return;
  if(!smemNa(n.gr)) return;
  const g=grById[n.gr];
  const subject='Trebovanje materijala \u2014 '+(g?unesc(g.naziv):'')+' \u2014 '+fmtDate(n.datum);
  const telo=narudzbaMailBody(n);
  /* Pravo slanje preko Edge Function-a (supabase/functions/posalji-trebovanje),
     samo kad je Supabase povezan. Deploy ceka Jovanovo "da" (CLAUDE.md). Dok
     funkcija nije deploy-ovana (ili RESEND_API_KEY nije podesen), invoke()
     vraca gresku i padamo nazad na mailto — bez ikakve vidljive razlike za
     korisnika osim sto (kad proradi) ne treba klik u mail klijentu. */
  if(mode==='supabase' && supa && supa.functions){
    try{
      const {error}=await supa.functions.invoke('posalji-trebovanje', { body:{ to:NABAVKA_EMAIL, subject, body:telo } });
      if(error) throw new Error(error.message||JSON.stringify(error));
      return;
    }catch(e){ console.error('Edge function posalji-trebovanje (fallback na mailto):', e); }
  }
  const url='mailto:'+encodeURIComponent(NABAVKA_EMAIL)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(telo);
  try{ window.open(url,'_self'); }catch(e){}
}

/* Gradilista (osim grId) na kojima je zaposleni trenutno angazovan. */
function drugde(z,grId){ return (z.grs||[]).filter(x=>x!==grId); }
function saveTim(grId){
  const g=grById[grId];
  if(!g || !(isDirector()||g.rukovodilac===ROLE)) return;
  /* Jovanova odluka (2026-09-15): puna lista ostaje, ali dodavanje osobe koja je
     vec na drugom gradilistu trazi potvrdu. Rukovodiocu se ne otkriva ime tudjeg
     gradilista — samo da postoji. */
  const novi=DATA.zaposleni.filter(z=>{ const c=document.getElementById('t_z_'+z.id); return c&&c.checked&&!(z.grs||[]).includes(grId)&&drugde(z,grId).length; });
  if(novi.length){
    const lista=novi.map(z=>'\u2022 '+unesc(z.ime)+(isDirector()?' (na: '+drugde(z,grId).map(x=>grById[x]?unesc(grById[x].naziv):x).join(', ')+')':'')).join('\n');
    if(!confirm('Sledeći zaposleni su već angažovani na drugom gradilištu:\n'+lista+'\n\nDodati ih i na ovo gradilište?')) return;
  }
  DATA.zaposleni.forEach(z=>{
    const c=document.getElementById('t_z_'+z.id); if(!c) return;
    const ima=(z.grs||[]).includes(grId);
    if(c.checked && !ima){ z.grs=[...(z.grs||[]),grId]; z.bivsi=(z.bivsi||[]).filter(x=>x!==grId); }
    if(!c.checked && ima){ z.grs=z.grs.filter(x=>x!==grId); z.bivsi=[...new Set([...(z.bivsi||[]),grId])]; }
  });
  saveState(); closeModal(); renderNav(); render(); openSite(grId);
}

function saveSite(){
  if(!isDirector()) return;
  const v=id=>document.getElementById(id).value;
  const naziv=esc(v('f_naziv').trim()); if(!naziv){ alert('Unesi naziv projekta.'); return; }
  let klijentId=v('f_kli');
  if(klijentId==='__novi__'){
    const kNaziv=esc(v('f_nk_naziv').trim());
    if(!kNaziv){ alert('Unesi naziv novog klijenta.'); return; }
    klijentId='c'+Date.now();
    DATA.clijenti.push({ id:klijentId, naziv:kNaziv, tip:v('f_nk_tip'), osoba:esc(v('f_nk_osoba').trim())||'—', tel:esc(v('f_nk_tel').trim())||'—', mail:'—' });
  }
  const cena=+v('f_cena')||0; const troRaw=v('f_tro').trim(); const tro=troRaw!==''?(+troRaw||0):Math.round(cena*0.85);
  const gid='g'+Date.now();
  const jeProNovi = v('f_modul')==='projektovanje';
  DATA.gradilista.push({
    id:gid, naziv, modul:v('f_modul')||'izvodjenje', tip:(v('f_modul')==='projektovanje'?null:(v('f_tip')||'visokogradnja')), lok:esc(v('f_lok').trim())||'—', povrsina:+v('f_povrsina')||null, nadzor:esc(v('f_nadzor').trim())||'', adm:{}, nivo:(jeProNovi?(v('f_nivo')||'IDR'):null), klijent:klijentId, rukovodilac:v('f_ruk'),
    pocetak:v('f_poc')||todayStr(), rok:v('f_rok')||plusDays(180), napredak:0, status:'planirano', faza:(jeProNovi?'Idejno rešenje':'Priprema terena'),
    budzet:cena, troskovi:tro, potroseno:0, naplaceno:0
  });
  if(jeProNovi){
    const fill=document.getElementById('f_nivo_fill');
    const niv=v('f_nivo')||'IDR';
    if(fill&&fill.checked&&NIVOI_DOK[niv]){
      const ts=Date.now();
      NIVOI_DOK[niv].forEach((sv,i)=>DATA.predmer.push({id:'pm'+ts+'-'+i, gr:gid, poz:niv+' — '+sv, jm:'kom', kol:1, cena:0, izv:0, zaduzen:null}));
    }
  } else {
    const fz=document.getElementById('f_faze_fill');
    rebuildMaps();                      // primeniSablonFaza cita grById
    if(fz&&fz.checked) primeniSablonFaza(gid);
  }
  rebuildMaps(); saveState(); closeModal(); renderNav(); render();
}

function openSite(id){
  const g=grById[id]; if(!g)return;
  if(!smemNa(id)) return;
  const cl=cliById[g.klijent], ruk=zapById[g.rukovodilac];
  const tim=timNa(id);
  const zad=DATA.zadaci.filter(t=>t.gr===id);
  const dd=dParse(g.rok), diff=daysBetween(TODAY,dd);
  const pot=potroseno(g), trSt=troskoviZa(id), subs=subsZa(id);
  const budPct=g.budzet?Math.round(pot/g.budzet*100):0;
  const m=marzaPct(g), n=naplataPct(g);
  const rokTekst = g.status==='zavrseno'?'Projekat predat'
    : diff<0?`<span style="color:var(--red)">Prekoračen za ${Math.abs(diff)} dana</span>`

  const zadHtml = zad.length? zad.map(t=>`
    <div class="dr-task ${t.kol==='done'?'done':''}">
      <div class="tk">${t.kol==='done'?icon('check'):''}</div>
      <div class="lb">${t.naziv}</div>

    </div>`).join('') : `<div style="color:var(--faint);font-size:13px">Nema zadataka za ovaj projekat.</div>`;

  const timHtml = tim.length? tim.map(z=>`
    <div class="dr-kv"><span class="k"><div class="who"><div class="av" style="width:26px;height:26px;font-size:11px">${initials(z.ime)}</div><span class="v link" style="font-weight:600" onclick="openEmp('${z.id}')">${z.ime}</span></div></span>
    <span class="v" style="font-weight:500;color:var(--muted)">${z.poz}</span></div>`).join('')
    : `<div style="color:var(--faint);font-size:13px">Nema dodeljenih ljudi.</div>`;

  document.getElementById('drawer').innerHTML = `
    <div class="dr-h">
      <button class="x" onclick="closeDrawer()">${icon('x')}</button>
      ${(isDirector()||g.rukovodilac===ROLE)?`<button class="x" style="right:58px;width:auto;padding:0 10px;font-size:12px;font-weight:600" onclick="formUpdate('${id}')">✎ Ažuriraj</button>`:''}

      <div class="loc">${icon('pin')} ${g.lok}</div>
      <div style="margin-top:12px">${badge(g.status)} <span style="font-size:12px;color:var(--muted);margin-left:6px">${g.faza}</span></div>
    </div>
    <div class="dr-b">
      <button class="btn" style="width:100%;margin-bottom:8px" onclick="openPredmer('${id}')">${jePro(g)?'Specifikacija usluga':'Predmer i količine'} →</button>
      ${isDirector()?`<div style="display:flex;gap:8px;margin-bottom:16px">
        <button class="btn" style="flex:1" onclick="openPresek('${id}')">Finansijski presek</button>
        <button class="btn ghost" style="flex:1" onclick="openIzvestaj('${id}')">Izveštaj za investitora</button>
      </div>`:''}
      ${isDirector()&&!jePro(g)&&!DATA.zadaci.some(t=>t.gr===id)?`<button class="btn ghost" style="width:100%;margin:-8px 0 16px" onclick="ubaciSablonFaza('${id}')">＋ Ubaci šablon faza (${PODTIPOVI[g.tip||'visokogradnja']})</button>`:''}
      <div class="dr-stats">
        <div class="dr-stat"><div class="l">Zdravlje projekta</div>
          <div style="display:flex;align-items:center;gap:10px;margin-top:6px">${ringSvg(zdravlje(g),40)}<span class="v num" style="color:${zdrBoja(zdravlje(g))}">${zdravlje(g)}<span style="font-size:12px;color:var(--faint)">/100</span></span></div>
        </div>
        <div class="dr-stat"><div class="l">Napredak</div><div class="v">${g.napredak}%</div>
          <div class="bar" style="margin-top:8px"><span style="width:${g.napredak}%;background:${g.status==='kasni'?'var(--red)':g.status==='zavrseno'?'var(--green)':'var(--blue)'}"></span></div>
        </div>
        <div class="dr-stat"><div class="l">Rok</div><div class="v" style="font-size:15px">${fmtDate(g.rok)}</div>
          <div style="font-size:12px;margin-top:6px">${rokTekst}</div>
        </div>
        ${canFinance()?`<div class="dr-stat"><div class="l">Plan. marža</div><div class="v ${marzaClass(m)}" style="font-size:17px">${String(m).replace('.',',')}%</div>

      </div>`:''}
      <div class="dr-sec">
        <h4>Zadaci (${zad.length})</h4>
        ${zadHtml}
      </div>
    </div>`;
  document.getElementById('drawer').classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('side').classList.remove('open');   // scrim je zajednicki: tap van sidebara ga zatvara
}
/* Hamburger na telefonu: sidebar (z 50) + scrim (z 40) — hamburger ostaje ISPOD otvorenog
   sidebara, pa je tap na scrim jedini nacin da se zatvori bez izbora stavke. */
function toggleSide(){
  const s=document.getElementById('side'); const on=s.classList.toggle('open');
  document.getElementById('scrim').classList.toggle('on', on);
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDrawer(); closeModal(); closeIzvestaj(); } });

/* ============================================================
   AUTH (Supabase). U demo/memorija rezimu (bez SUPABASE_URL) se ne koristi.
   Uloga dolazi iz tabele profili, ne iz menija; RLS na serveru sprovodi isto
   pravilo kao smemNa() ovde.
   ============================================================ */
async function initAuth(){
  try{
    const {data}=await supa.auth.getSession();
    SESIJA=(data&&data.session)||null;
    if(!SESIJA){ prikaziLogin(); return false; }
    const {data:prof,error}=await supa.from('profili').select('*').eq('user_id',SESIJA.user.id).maybeSingle();
    if(error) throw error;
    if(!prof){
      prikaziLogin('Nalog '+esc(SESIJA.user.email||'')+' postoji, ali nije povezan ni sa jednom ulogom. Javi direktoru da pokrene povezi_profil().');
      try{ await supa.auth.signOut(); }catch(e){}
      return false;
    }
    PROFIL=prof;
    ROLE = prof.uloga==='direktor' ? 'all' : prof.zaposleni_id;
    return true;
  }catch(e){
    console.error('Auth:', e);
    prikaziLogin('Greška pri proveri prijave: '+esc(e.message||e));
    return false;
  }
}
function prikaziLogin(poruka){
  document.body.classList.add('login');
  document.getElementById('view').innerHTML=`<div class="login-wrap"><div class="login-card">
    <h1>GradnjaOS</h1><p>Prijavi se nalogom koji ti je dodelio direktor.</p>
    ${poruka?`<div class="err">${poruka}</div>`:''}
    <div class="f-row"><label>Email</label><input id="l_email" type="email" autocomplete="username" placeholder="ime@firma.rs"></div>
    <div class="f-row"><label>Lozinka</label><input id="l_pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')prijava()"></div>
    <div id="l_msg"></div>
    <button class="btn" style="width:100%" onclick="prijava()">Prijavi se</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="prijavaLink()">Pošalji mi link za prijavu na email</button>
  </div></div>`;
}
function loginPoruka(html){ const m=document.getElementById('l_msg'); if(m) m.innerHTML=html; }
async function prijava(){
  const email=((document.getElementById('l_email')||{}).value||'').trim(), pw=(document.getElementById('l_pw')||{}).value||'';
  if(!email||!pw){ loginPoruka('<div class="err">Unesi email i lozinku.</div>'); return; }
  const {error}=await supa.auth.signInWithPassword({email, password:pw});
  if(error){ loginPoruka('<div class="err">'+esc(/invalid/i.test(error.message||'')?'Pogrešan email ili lozinka.':(error.message||error))+'</div>'); return; }
  location.reload();
}
async function prijavaLink(){
  const email=((document.getElementById('l_email')||{}).value||'').trim();
  if(!email){ loginPoruka('<div class="err">Unesi email, pa klikni na link.</div>'); return; }
  const {error}=await supa.auth.signInWithOtp({email, options:{shouldCreateUser:false}});
  loginPoruka(error ? '<div class="err">'+esc(error.message||error)+'</div>'
                    : '<div class="ok">Link je poslat na '+esc(email)+'. Otvori ga na ovom uređaju.</div>');
}
async function odjava(){ flushSave(); try{ await supa.auth.signOut(); }catch(e){} location.reload(); }
async function promeniLozinku(){
  const p=prompt('Nova lozinka (najmanje 8 znakova):'); if(p===null) return;
  if(String(p).length<8){ alert('Lozinka mora imati najmanje 8 znakova.'); return; }
  const {error}=await supa.auth.updateUser({password:String(p)});
  alert(error ? 'Nije uspelo: '+(error.message||error) : 'Lozinka je promenjena.');
}
/* Kutija u sidebaru: demo rezim = meni uloga; prijavljen = nalog (+ meni "pogled kao" za direktora). */
function renderNalog(){
  const box=document.getElementById('roleBox'); if(!box) return;
  if(!PROFIL){ box.innerHTML='<label>Prijavljen kao</label><select id="roleSel" onchange="setRole(this.value)"></select>'; return; }
  const dir=PROFIL.uloga==='direktor';
  box.innerHTML='<label>Nalog</label><div class="acc"><b>'+esc(PROFIL.ime||'')+'</b><small>'+esc((SESIJA&&SESIJA.user&&SESIJA.user.email)||'')+' · '+(dir?'direktor':'rukovodilac')+'</small></div>'
    +(dir?'<label style="margin-top:10px">Pogled kao</label><select id="roleSel" onchange="setRole(this.value)"></select>':'')
    +'<div class="acc-btns"><button onclick="promeniLozinku()">Lozinka</button><button onclick="odjava()">Odjavi se</button></div>';
}

function normalizeData(){
  (DATA.zaposleni||[]).forEach(z=>{ if(!Array.isArray(z.grs)) z.grs = z.gr?[z.gr]:[]; delete z.gr; if(!Array.isArray(z.bivsi)) z.bivsi=[]; });
  (DATA.gradilista||[]).forEach(g=>{ if(!g.modul) g.modul='izvodjenje'; if(g.modul==='izvodjenje'&&!g.tip) g.tip='visokogradnja'; });
  if(!DATA.situacije) DATA.situacije=[];
  if(!DATA.narudzbe) DATA.narudzbe=[];
  if(!DATA.troskovi_st) DATA.troskovi_st=[];
  if(!DATA.podizvodjaci) DATA.podizvodjaci=[];
  (DATA.podizvodjaci||[]).forEach(x=>{ if(!Array.isArray(x.grs)) x.grs=[]; });
  if(!DATA.predmer) DATA.predmer=[];
  if(!DATA.resursi) DATA.resursi=[];
  if(!DATA.magacin) DATA.magacin=[];
  if(!DATA.mag_promene) DATA.mag_promene=[];
  (DATA.gradilista||[]).forEach(g=>{
    if(!g.adm) g.adm={};
    Object.keys(g.adm).forEach(k=>{
      const v=g.adm[k];
      if(v===true) g.adm[k]={st:'ima'};
      else if(v===false||v==null) g.adm[k]={st:'nema'};
      else if(!v.st) v.st='nema';
    });
  });
}
(async ()=>{
  await initSupa();
  if(supa && !(await initAuth())) return;   // ekran za prijavu — podaci se ne ucitavaju bez sesije
  await loadState();
  normalizeData();
  if(mode==='supabase') zapamtiSnapshot(DATA);   // posle normalize, da prvi diff ne gura sve
  rebuildMaps();
  renderNalog();
  renderNav();
  render();
})();
</script>
