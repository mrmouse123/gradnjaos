<!DOCTYPE html>
<html lang="sr-Latn-RS">
<!-- GradnjaOS — Pilot PM alat za građevinsku firmu -->
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GradnjaOS — kontrolna tabla</title>
<!-- PWA: "Dodaj na početni ekran" otvara app preko celog ekrana, bez adresne trake -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4E79">
<script>/* tema pre prvog crtanja (bez bljeska): sacuvan izbor ili sistem */try{var _t=localStorage.getItem('gos_tema');if(_t==='dark'||_t==='light')document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="ikone/icon.svg">
<link rel="apple-touch-icon" href="ikone/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GradnjaOS">
<link rel="preconnect" href="https://xqggoxrihitvqaocowlb.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preload" as="script" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/app.css?v=18ff2f5815">

<div class="app">
  <!-- ===== Sidebar ===== -->
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-6h6v6"/>
        </svg>
      </div>
      <div>
        <b>GradnjaOS</b>
        <small>Pilot v0.2</small>
      </div>
    </div>

    <div class="role-box" id="roleBox">
      <label>Prijavljen kao</label>
      <select id="roleSel" onchange="setRole(this.value)"></select>
    </div>
    <div class="tema-box">Tema
      <div class="seg" id="temaSeg">
        <button onclick="postaviTemu('system')" title="Prati podešavanje telefona/računara">Auto</button>
        <button onclick="postaviTemu('light')">Svetla</button>
        <button onclick="postaviTemu('dark')">Tamna</button>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="side-foot" id="sideFoot">
      <span class="dot mem"></span> Čuvanje: provera…<br>
      <button class="reset" onclick="resetDemo()">↺ Vrati demo podatke</button>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <main class="main">
    <button class="menu-btn" onclick="toggleSide()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div id="view"></div>
  </main>
  <!-- Telefon/tablet: donja navigacija (5 najčešćih odredišta), puni se u renderNav() -->
  <nav class="bnav" id="bnav" aria-label="Brza navigacija"></nav>
</div>

<!-- ===== Drawer ===== -->
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"></aside>
<button class="ai-dugme" id="aiDugme" onclick="aiOtvori()" title="AI asistent direktora"></button>
<aside class="ai-panel" id="aiPanel" aria-label="Asistent"></aside>

<!-- ===== Modal ===== -->
<div class="rpt" id="rpt" onclick="if(event.target===this)closeIzvestaj()"></div>

<div class="modal-wrap" id="modalWrap">
  <div class="bg" onclick="closeModal()"></div>
  <div class="modal" id="modal"></div>
</div>
