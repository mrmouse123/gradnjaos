name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # test/e2e.js: bez zavisnosti, izlaz 0 = sve prošlo, 1 = bar jedan pad
      - run: node test/e2e.js

  # Prave SQL provere nad Postgresom: formula situacija (isti scenariji kao T67 u e2e.js) i RLS po ulogama nad schema.sql
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node test/sql/situacije-parity.js | psql -v ON_ERROR_STOP=1
      - run: node test/rls/run.js | psql -v ON_ERROR_STOP=1
