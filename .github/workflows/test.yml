name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # test/e2e.js: bez zavisnosti, izlaz 0 = sve prošlo, 1 = bar jedan pad
      - run: node test/e2e.js
